version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - DOMAIN=https://vault.example.com
    volumes:
      - /srv/docker/data/vaultwarden:/data
    ports:
      - "8080:80"

  vaultwarden-backup:
    image: bruceforce/vaultwarden-backup:2.1.6
    container_name: vaultwarden-backup
    restart: unless-stopped
    environment:
      - CRON_TIME=0 3 * * *
      - TIMESTAMP=true
      - DELETE_AFTER=30
      - BACKUP_ON_STARTUP=true
      - TZ=Asia/Qatar
    volumes:
      - /srv/docker/data/vaultwarden:/data:ro
      - /srv/docker/backups/vaultwarden:/backup